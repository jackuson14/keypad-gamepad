name: build-release

# Build the Windows .exe and publish it as a GitHub Release asset whenever a
# semver tag (vX.Y.Z) is pushed. The in-app "Check for updates" feature reads
# this release via the GitHub API, so the asset name must stay
# `keypad-gamepad-analog.exe` (see updater.ASSET_NAME).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create the release and upload the asset

jobs:
  build:
    runs-on: windows-latest   # PyInstaller + hidapi + vgamepad + win hotkey need Windows
    timeout-minutes: 20        # vgamepad's installer once hung here for ~90 min; fail fast instead of burning runner minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pre-satisfy vgamepad's ViGEmBus driver check
        # vgamepad 0.1.0's setup.py runs `msiexec /i ViGEmBusSetup.msi` with NO silent
        # flag whenever it can't find the driver in the registry. On a headless runner
        # that MSI's GUI blocks forever (the build that prompted this hung ~90 min on it).
        # The driver isn't needed to BUILD -- vgamepad's client DLLs ship as bundled data
        # and the app only attaches to the driver at runtime -- so we plant the uninstall
        # key its detection greps for, which makes it think the driver is present and skip
        # the installer. See: github.com/yannbouteiller/vgamepad/blob/v0.1.0/setup.py
        shell: cmd
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ViGEmBus" /v DisplayVersion /t REG_SZ /d "0.0.0.0" /f /reg:64
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ViGEmBus" /v DisplayName /t REG_SZ /d "Nefarius Virtual Gamepad Emulation Bus Driver" /f /reg:64

      - name: Install dependencies
        env:
          # Honoured by vgamepad > 0.1.0; harmless on 0.1.0 (covered by the registry shim above).
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
        run: |
          py -m pip install --upgrade pip
          py -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch hidapi.dll
        run: powershell -ExecutionPolicy Bypass -File tools/fetch_hidapi.ps1

      - name: Sync version.py to the tag
        # Build-time only: makes the bundled .exe self-report the tag's version even
        # if version.py wasn't bumped before tagging. Does not commit back.
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Set-Content version.py "__version__ = `"$v`"" -Encoding utf8
          Write-Output "version.py -> $v"

      - name: Build the .exe
        # ViGEmBus is NOT needed to build: vgamepad's client DLLs ship as bundled data
        # and the app only attaches to the driver at runtime, which the build never does.
        run: powershell -ExecutionPolicy Bypass -File tools/build_exe.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/keypad-gamepad-analog.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
